[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "displaced-observables"
version = "0.2.0"
description = "Displacement-weighted jet substructure observables for dark-shower anomaly detection"
requires-python = ">=3.11"

[project.scripts]
displaced-observables = "displaced_observables.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/displaced_observables"]
