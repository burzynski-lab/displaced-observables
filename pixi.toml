[workspace]
authors = ["jburzyns <jackson.carl.burzynski@cern.ch>"]
channels = ["conda-forge"]
name = "displaced-observables"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

# every step goes through the one executable: `pixi run displaced-observables <command>`
[tasks]
generate = "displaced-observables generate"
analyze  = "displaced-observables analyze"
features = "displaced-observables features"
train    = "displaced-observables train"
evaluate = "displaced-observables evaluate"
scan     = "displaced-observables scan"
plot     = "displaced-observables plot"
test     = "pytest tests/ -v"
paper    = "tectonic paper/main.tex"

[dependencies]
python = "3.12.*"
# generators
pythia8 = ">=8.312"
lhapdf = "*"
hepmc3 = "*"
# jets + detector
fastjet = ">=3.4"
delphes = ">=3.5"
root = "*"
# analysis stack
numpy = "*"
awkward = ">=2"
uproot = ">=5"
hist = "*"
vector = "*"
matplotlib = "*"
scikit-learn = "*"
scipy = "*"
pyarrow = "*"
tqdm = "*"
pyyaml = "*"
pytest = "*"
mplhep = ">=1.3.3,<2"
tectonic = ">=0.17.0,<0.18"

[pypi-dependencies]
displaced-observables = { path = ".", editable = true }

# MadGraph pins python 3.9 on conda-forge, so it lives in its own environment:
#   pixi run -e mg5 mg5_aMC cards/madgraph/<proc_card>.dat
[feature.mg5.dependencies]
mg5amcnlo = ">=3.5"
lhapdf = "*"

# torch stack for the AE/VAE anomaly-detection study (design mirrors the
# ej-vae framework: plain FC VAENet, MSE+KLD ELBO, z-score InputNorm)
[feature.ml.dependencies]
pytorch = ">=2.4"
h5py = "*"
xgboost = "*"
lightning = ">=2.4"
jsonargparse = "*"
typeshed-client = "*"     # jsonargparse[signatures] extras
docstring_parser = "*"

# CUDA torch for the ouheptmp GPU node. linux-64 only so the lockfile still
# solves for osx-arm64.
[feature.gpu]
platforms = ["linux-64"]
[feature.gpu.system-requirements]
cuda = "12"
[feature.gpu.dependencies]
pytorch-gpu = "*"
cuda-version = "12.*"

[environments]
mg5 = { features = ["mg5"], no-default-feature = true }
ml = { features = ["ml"] }
gpu = { features = ["ml", "gpu"] }
